<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaDory Tours Hurghada - Excursions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-10">
        <!-- Header & Sélecteur de langue -->
        <div class="bg-blue-600 text-white p-6 text-center shadow-md relative">
            <div class="flex justify-end gap-1.5 mb-3">
                <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn px-2 py-0.5 text-xs font-bold rounded bg-white text-blue-600 transition">FR</button>
                <button onclick="setLanguage('en')" id="btn-en" class="lang-btn px-2 py-0.5 text-xs font-bold rounded bg-blue-700 text-white hover:bg-blue-500 transition">EN</button>
                <button onclick="setLanguage('ru')" id="btn-ru" class="lang-btn px-2 py-0.5 text-xs font-bold rounded bg-blue-700 text-white hover:bg-blue-500 transition">RU</button>
                <button onclick="setLanguage('de')" id="btn-de" class="lang-btn px-2 py-0.5 text-xs font-bold rounded bg-blue-700 text-white hover:bg-blue-500 transition">DE</button>
            </div>

            <!-- Logo MaDory Tours -->
            <div class="flex justify-center mb-3">
                <img id="brand-logo" src="logo.png" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=MaDory+Tours&background=ffffff&color=2563eb&size=128&bold=true';" alt="MaDory Tours Hurghada" class="w-20 h-20 rounded-full object-cover border-2 border-white shadow-md">
            </div>

            <h1 class="text-2xl font-bold">MaDory Tours</h1>
            <p id="subtitle" class="text-sm opacity-90">Explorez et réservez vos excursions</p>
        </div>

        <!-- Recherche & Filtres -->
        <div class="p-4 space-y-3">
            <input type="text" id="search" placeholder="Rechercher une excursion..." class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div id="filters" class="flex flex-wrap gap-2">
                <!-- Boutons de catégories injectés par JS -->
            </div>
        </div>

        <!-- Grille du Catalogue -->
        <div id="catalog" class="p-4 grid grid-cols-1 gap-4">
            <p class="text-center text-gray-400 py-10">Chargement des excursions...</p>
        </div>
    </div>

    <script>

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqOcHpCekcTK0qob8SOnpuMNhC7kM24JRJjb_stBGYP7qzh0RD-03Wd67l7N-gHGcLCxYIj3Zf2tWS/pub?output=csv';
        const WHATSAPP_NUMBER = '4915732832479';
        
        let excursions = [];
        let categories = ['All'];
        let currentCategory = 'All';
        let currentLang = 'fr';

        const translations = {

                subtitle: "Explorez et réservez vos excursions",
                searchPlaceholder: "Rechercher une excursion...",
                allCategory: "Tous",
                noResults: "Aucune excursion trouvée.",
                onRequest: "Sur demande",
                bookBtn: "Réserver",
                whatsappMsg: "Bonjour, je souhaite réserver l'excursion : "
            },
            en: {
                subtitle: "Explore and book your excursions",
                searchPlaceholder: "Search for an excursion...",
                allCategory: "All",
                noResults: "No excursions found.",
                onRequest: "On request",
                bookBtn: "Book now",
                whatsappMsg: "Hello, I would like to book the excursion: "
            },
            ru: {
                subtitle: "Исследуйте и бронируйте экскурсии",
                searchPlaceholder: "Поиск экскурсии...",
                allCategory: "Все",
                noResults: "Экскурсии не найдены.",
                onRequest: "По запросу",

                whatsappMsg: "Здравствуйте, я хотел(а) бы забронировать экскурсию: "
            },
            de: {
                subtitle: "Entdecken und buchen Sie Ihre Ausflüge",
                searchPlaceholder: "Ausflug suchen...",
                allCategory: "Alle",
                noResults: "Keine Ausflüge gefunden.",
                onRequest: "Auf Anfrage",
                bookBtn: "Buchen",
                whatsappMsg: "Hallo, ich möchte folgenden Ausflug buchen: "
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-blue-600');
                btn.classList.add('bg-blue-700', 'text-white');
            });
            const activeBtn = document.getElementById(`btn-${lang}`); activeBtn.classList.remove('bg-blue-700', 'text-white'); activeBtn.classList.add('bg-white', 'text-blue-600');  const t = translations[lang]; document.getElementById('subtitle').innerText = t.subtitle; document.getElementById('search').placeholder = t.searchPlaceholder;  initFilters(); applyFiltersAndSearch(); }  function getLocalizedText(item, baseField) { if (currentLang === 'fr') return item[baseField] \vert{}\vert{} ''; const langSuffix = `_${currentLang.toUpperCase()}`;
            return item[`${baseField}${langSuffix}`] || item[baseField] || '';
        }

        fetch(CSV_URL)
            .then(response => response.text())
            .then(csvText => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: h => h.trim(),
                    complete: function(results) {
                        excursions = results.data.filter(item => {
                            const hasName = item.Nom && item.Nom.trim() !== '';
                            const isAvailable = !item.Disponible || item.Disponible.trim().toLowerCase() === 'oui';
                            return hasName && isAvailable;
                        });
                        categories = ['All', ...new Set(excursions.map(item => item.Catégorie && item.Catégorie.trim()).filter(Boolean))];
                        initFilters();
                        renderCatalog(excursions);
                    }
                });
            })
            .catch(() => {
                document.getElementById('catalog').innerHTML = `<p class="text-center text-red-500 py-10">Erreur de chargement des données.</p>`;
            });

        function initFilters() {
            const container = document.getElementById('filters');
            container.innerHTML = '';
            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.innerText = category === 'All' ? translations[currentLang].allCategory : category;
                const isSelected = category === currentCategory;
                btn.className = `category-btn px-3 py-1 rounded-full text-sm font-medium transition ${isSelected ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}`;
                btn.onclick = () => {
                    currentCategory = category;
                    initFilters();
                    applyFiltersAndSearch();
                };
                container.appendChild(btn);
            });
        }

        function applyFiltersAndSearch() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = excursions.filter(item => {
                const cat = item.Catégorie ? item.Catégorie.trim() : '';
                const matchesCategory = currentCategory === 'All' || cat === currentCategory;
                const nom = getLocalizedText(item, 'Nom').toLowerCase();
                const desc = getLocalizedText(item, 'Description').toLowerCase();
                const matchesSearch = nom.includes(term) || desc.includes(term);
                return matchesCategory && matchesSearch;
            });
            renderCatalog(filtered);
        }

        document.getElementById('search').addEventListener('input', applyFiltersAndSearch);

        function renderCatalog(data) {
            const container = document.getElementById('catalog');
            container.innerHTML = '';
            const t = translations[currentLang];
            
            if(data.length === 0) {
