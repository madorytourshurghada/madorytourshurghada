<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaDory Tours Hurghada - Excursions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-10">
        <!-- Header & Sélecteur de langue -->
        <div class="bg-blue-600 text-white p-6 text-center shadow-md relative">
            <!-- Sélecteur de langue en haut à droite -->
            <div class="flex justify-end gap-1.5 mb-3">
                <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn px-2 py-0.5 text-xs font-bold rounded bg-white text-blue-600 transition">FR</button>
                <button onclick="setLanguage('en')" id="btn-en" class="lang-btn px-2 py-0.5 text-xs font-bold rounded bg-blue-700 text-white hover:bg-blue-500 transition">EN</button>
                <button onclick="setLanguage('ru')" id="btn-ru" class="lang-btn px-2 py-0.5 text-xs font-bold rounded bg-blue-700 text-white hover:bg-blue-500 transition">RU</button>
                <button onclick="setLanguage('de')" id="btn-de" class="lang-btn px-2 py-0.5 text-xs font-bold rounded bg-blue-700 text-white hover:bg-blue-500 transition">DE</button>
            </div>

            <!-- Logo MaDory Tours -->
            <div class="flex justify-center mb-3">
                <img id="brand-logo" src="logo.png" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=MaDory+Tours&background=ffffff&color=2563eb&size=128&bold=true';" alt="MaDory Tours Hurghada" class="w-20 h-20 rounded-full object-cover border-2 border-white shadow-md">
            </div>

            <h1 class="text-2xl font-bold">MaDory Tours</h1>
            <p id="subtitle" class="text-sm opacity-90">Explorez et réservez vos excursions</p>
        </div>

        <!-- Recherche & Filtres -->
        <div class="p-4 space-y-3">
            <input type="text" id="search" placeholder="Rechercher une excursion..." class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div id="filters" class="flex flex-wrap gap-2">
                <!-- Boutons de catégories injectés par JS -->
            </div>
        </div>

        <!-- Grille du Catalogue -->
        <div id="catalog" class="p-4 grid grid-cols-1 gap-4">
            <!-- Cartes injectées par JS -->
        </div>
    </div>

    <script>
        // Lien CSV exact récupéré depuis votre Google Sheet publié
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqOcHpCekcTKOqobb5OnpuMNHC7M24JRJjb_9tBGYP7qzh0RD-Q3Wd6T7N-ghGcLCxYIj3Z72tWSp5ub/pub?output=csv';
        const WHATSAPP_NUMBER = '4915732832479';
        
        let excursions = [];
        let categories = ['All'];
        let currentCategory = 'All';
        let currentLang = 'fr';

        // Dictionnaire de traduction de l'interface
        const translations = {
            fr: {
                subtitle: "Explorez et réservez vos excursions",
                searchPlaceholder: "Rechercher une excursion...",
                allCategory: "Tous",
                noResults: "Aucune excursion trouvée.",
                onRequest: "Sur demande",
                bookBtn: "Réserver",
                whatsappMsg: "Bonjour, je souhaite réserver l'excursion : "
            },
            en: {
                subtitle: "Explore and book your excursions",
                searchPlaceholder: "Search for an excursion...",
                allCategory: "All",
                noResults: "No excursions found.",
                onRequest: "On request",
                bookBtn: "Book now",
                whatsappMsg: "Hello, I would like to book the excursion: "
            },
            ru: {
                subtitle: "Исследуйте и бронируйте экскурсии",
                searchPlaceholder: "Поиск экскурсии...",
                allCategory: "Все",
                noResults: "Экскурсии не найдены.",
                onRequest: "По запросу",
                bookBtn: "Забронировать",
                whatsappMsg: "Здравствуйте, я хотел(а) бы забронировать экскурсию: "
            },
            de: {
                subtitle: "Entdecken und buchen Sie Ihre Ausflüge",
                searchPlaceholder: "Ausflug suchen...",
                allCategory: "Alle",
                noResults: "Keine Ausflüge gefunden.",
                onRequest: "Auf Anfrage",
                bookBtn: "Buchen",
                whatsappMsg: "Hallo, ich möchte folgenden Ausflug buchen: "
            }
        };

        // Changement de langue
        function setLanguage(lang) {
            currentLang = lang;
            
            // Mise à jour visuelle des boutons de langue
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-blue-600');
                btn.classList.add('bg-blue-700', 'text-white');
            });
            const activeBtn = document.getElementById(`btn-${lang}`);
            activeBtn.classList.remove('bg-blue-700', 'text-white');
            activeBtn.classList.add('bg-white', 'text-blue-600');

            // Mise à jour des textes statiques
            const t = translations[lang];
            document.getElementById('subtitle').innerText = t.subtitle;
            document.getElementById('search').placeholder = t.searchPlaceholder;

            // Rafraîchir les filtres et les cartes
            initFilters();
            applyFiltersAndSearch();
        }

        // Récupération du contenu selon la langue (avec repli sur le français par défaut)
        function getLocalizedText(item, baseField) {
            if (currentLang === 'fr') return item[baseField] || '';
            const langSuffix = `_${currentLang.toUpperCase()}`; // ex: Nom_EN, Description_RU
            return item[`${baseField}${langSuffix}`] || item[baseField] || '';
        }

        // Chargement des données Google Sheets
        fetch(CSV_URL)
            .then(response => response.text())
            .then(csvText => {
                Papa.parse(csvText, {
                    header: true,
                    complete: function(results) {
                        // Affiche les lignes où Disponible est 'Oui' (ou si la colonne Disponible n'est pas encore créée)
                        excursions = results.data.filter(item => item.Nom && (item.Disponible === 'Oui' || item.Disponible === undefined || item.Disponible === ''));
                        categories = ['All', ...new Set(excursions.map(item => item.Catégorie).filter(Boolean))];
                        initFilters();
                        renderCatalog(excursions);
                    }
                });
            });

        function initFilters() {
            const container = document.getElementById('filters');
            container.innerHTML = '';
            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.innerText = category === 'All' ? translations[currentLang].allCategory : category;
                const isSelected = category === currentCategory;
                btn.className = `category-btn px-3 py-1 rounded-full text-sm font-medium transition ${isSelected ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}`;
                btn.onclick = () => {
                    currentCategory = category;
                    initFilters();
                    applyFiltersAndSearch();
                };
                container.appendChild(btn);
            });
        }

        function applyFiltersAndSearch() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = excursions.filter(item => {
                const matchesCategory = currentCategory === 'All' || item.Catégorie === currentCategory;
                const nom = getLocalizedText(item, 'Nom').toLowerCase();
                const desc = getLocalizedText(item, 'Description').toLowerCase();
                const matchesSearch = nom.includes(term) || desc.includes(term);
                return matchesCategory && matchesSearch;
            });
            renderCatalog(filtered);
        }

        document.getElementById('search').addEventListener('input', applyFiltersAndSearch);

        function renderCatalog(data) {
            const container = document.getElementById('catalog');
            container.innerHTML = '';
            const t = translations[currentLang];
            
            if(data.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 col-span-full py-10">${t.noResults}</p>`;
                return;
            }

            data.forEach(item => {
                const nom = getLocalizedText(item, 'Nom');
                const description = getLocalizedText(item, 'Description');
                const priceDisplay = item.Prix === 'Sur demande' ? t.onRequest : `${item.Prix} ${item.Devise || 'EUR'}`;
                const imageUrl = item.Image_URL || 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=600&q=80';
                const message = encodeURIComponent(`${t.whatsappMsg}${nom}`);
                const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

                const card = `
                    <div class="bg-white rounded-xl overflow-hidden shadow border border-gray-100 flex flex-col">
                        <img src="${imageUrl}" alt="${nom}" class="w-full h-48 object-cover">
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">${item.Catégorie || ''}</span>
                                <h3 class="text-lg font-bold text-gray-900 mt-1">${nom}</h3>
                                <p class="text-sm text-gray-600 mt-2 line-clamp-3">${description}</p>
                            </div>
                            <div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between">
                                <span class="text-xl font-extrabold text-gray-900">${priceDisplay}</span>
                                <a href="${whatsappUrl}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center shadow-sm transition">
                                    <svg class="w-4 h-4 mr-1.5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.443-9.89 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                                    ${t.bookBtn}
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }
    </script>
</body>
</html>
